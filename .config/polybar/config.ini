# vim:ft=dosini

;==========================================================
;
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;
;   To learn more about how to configure Polybar
;   go to https://github.com/jaagr/polybar
;
;   The README contains alot of information
;
;==========================================================

[colors]
alpha = #99

background = ${env:POLYBAR_BG}
foreground = ${xrdb:foreground}
primary = ${xrdb:color3}
secondary = #e60053
alert = #bd2c40

[bar/top]
monitor = ${env:MONITOR:eDP-1}
override-redirect = true
wm-restack = i3
bottom = false
fixed-center = true
width = 16%
height = 22
offset-x = 42%
offset-y = 2
background = ${colors.background}
foreground = ${colors.foreground}
radius = 8
line-size = 0
line-color= #f00
border-top-size = 1
border-bottom-size = 1
border-size = 2
border-color = ${colors.foreground}
;padding-right = 1
;padding-left = 1
;module-margin = 0
font-0 = Hack Nerd Font:size=10;3
modules-center = date
;separator =
dim-value = 1.0
wm-name = i3
dpi-x = 0
dpi-y = 0
enable-ipc = true


[bar/bottom]
; Use either of the following command to list available outputs:
; If unspecified, the application will pick the first one it finds.
; $ polybar -m | cut -d ':' -f 1
; $ xrandr -q | grep " connected" | cut -d ' ' -f1
monitor = ${env:MONITOR:eDP-1}

; Use the specified monitor as a fallback if the main one is not found.
; monitor-fallback =

; Require the monitor to be in connected state
; XRandR sometimes reports my monitor as being disconnected (when in use)
; monitor-strict = false

; Tell the Window Manager not to configure the window.
; Use this to detach the bar if your WM is locking its size/position.
; Note: With this most WMs will no longer reserve space for
; the bar and it will overlap other windows. You need to configure
; your WM to add a gap where the bar will be placed.
override-redirect = true

; Restack the bar window and put it above the
; selected window manager's root
;
; Fixes the issue where the bar is being drawn
; on top of fullscreen window's
;
; Currently supported WM's:
;   bspwm
;   i3 (requires: `override-redirect = true`)
wm-restack = i3

; Put the bar at the bottom of the screen
bottom = True

; Prefer fixed center position for the `modules-center` block
; When false, the center position will be based on the size of the other blocks.
fixed-center = true

; Dimension defined as pixel value (e.g. 35) or percentage (e.g. 50%),
; the percentage can optionally be extended with a pixel offset like so:
; 50%:-10, this will result in a width or height of 50% minus 10 pixels
#width = 93.25%
##width = 97.25%
width = 96%
##height = 37
height = 28

; Offset defined as pixel value (e.g. 35) or percentage (e.g. 50%)
; the percentage can optionally be extended with a pixel offset like so:
; 50%:-10, this will result in an offset in the x or y direction
; of 50% minus 10 pixels
#offset-x = 3.4%
##offset-x = 26
offset-x = 2%
offset-y = 2

; Background ARGB color (e.g. #f00, #ff992a, #ddff1023)
#background = #66010101
#background = #FF000000
background = ${colors.background}
;background = #990B2D33

; Foreground ARGB color (e.g. #f00, #ff992a, #ddff1023)
foreground = ${colors.foreground}

; Background gradient (vertical steps)
;   background-[0-9]+ = #aarrggbb
; background-0 =

; Value used for drawing rounded corners
; pseudo-transparency or use a compositor like compton.
; Individual top/bottom values can be defined using:
;   radius-{top,bottom}
 radius = 12

; Under-/overline pixel size and argb color
; Individual values can be defined using:
;   {overline,underline}-size
;   {overline,underline}-color
line-size = 0

; Values applied to all borders
; Individual side values can be defined using:
;   border-{left,top,right,bottom}-size
;   border-{left,top,right,bottom}-color
; The top and bottom borders are added to the bar height, so the effective
; window height is:
;   height + border-top-size + border-bottom-size
; Meanwhile the effective window width is defined entirely by the width key and
; the border is placed withing this area. So you effectively only have the
; following horizontal space on the bar:
;   width - border-right-size - border-left-size
border-color = ${colors.foreground}
border-size = 0


; Number of spaces to add at the beginning/end of the bar
; Individual side values can be defined using:
;   padding-{left,right}
##padding-right = 4
padding-right = 2
padding-left = 2

; Number of spaces to add before/after each module
; Individual side values can be defined using:
;   module-margin-{left,right}
module-margin = 2

; Fonts are defined using <font-name>;<vertical-offset>
; Font names are specified using a fontconfig pattern.
;   font-0 = NotoSans-Regular:size=8;2
;   font-1 = MaterialIcons:size=10
;   font-2 = Termsynu:size=8;-1
;   font-3 = FontAwesome:size=10
; See the Fonts wiki page for more details
;font-0 = Hack Nerd Font:size=11;3
font-0 = Hack Nerd Font:size=11;3
;font-0 = Inconsolata:bold:size=10;1.5

; Modules are added to one of the available blocks
;   modules-left = cpu ram
;   modules-center = xwindow xbacklight
;   modules-right = ipc clock
#modules-left = i3 sep layout sep ext-ipv4 sep mpd
#modules-left = i3 sep
#modules-right = tray sep layout sep wireless-network sep temperature sep pulseaudio sep backlight-acpi sep battery0 sep battery1 sep memory sep cpu sep date
modules-left = i3
modules-right = layout tray wireless-network temperature pulseaudio backlight-acpi battery0 battery1 memory cpu date

; The separator will be inserted between the output of each module
separator = "/"

; This value is used to add extra spacing between elements
; @deprecated: This parameter will be removed in an upcoming version
; spacing = 0

; Opacity value between 0.0 and 1.0 used on fade in/out
dim-value = 1.0

; Value to be used to set the WM_NAME atom
; If the value is empty or undefined, the atom value
; will be created from the following template: polybar-[BAR]_[MONITOR]
; NOTE: The placeholders are not available for custom values
;wm-name = i3

; Set a DPI values used when rendering text
; This only affects scalable fonts
; Set this to 0 to let polybar calculate the dpi from the screen size.
; dpi =
dpi-x = 96
dpi-y = 89

; Enable support for inter-process messaging
; See the Messaging wiki page for more details.
enable-ipc = true

; Fallback click handlers that will be called if
; there's no matching module handler found.
[module/i3]
type = internal/i3

; Only show workspaces defined on the same output as the bar
;
; Useful if you want to show monitor specific workspaces
; on different bars
;
; Default: false
pin-workspaces = false

; This will split the workspace name on ':'
; Default: false
strip-wsnumbers = false

; Sort the workspaces by index instead of the default
; sorting that groups the workspaces by output
; Default: false
index-sort = true

; Create click handler used to focus workspace
; Default: true
enable-click = true

; Create scroll handlers used to cycle workspaces
; Default: true
enable-scroll = false

; Wrap around when reaching the first/last workspace
; Default: true
wrapping-scroll = false

; Set the scroll cycle direction
; Default: true
reverse-scroll = false

; Use fuzzy (partial) matching on labels when assigning
; icons to workspaces
; Example: code;♚ will apply the icon to all workspaces
; containing 'code' in the label
; Default: false
fuzzy-match = false

ws-icon-0 = 0;󰖟
ws-icon-1 = 1;󰍪
ws-icon-2 = 2;
ws-icon-3 = 3;
ws-icon-4 = 4;
ws-icon-5 = 5;󰿏
ws-icon-6 = 6;
ws-icon-7 = 7;
ws-icon-8 = 8;󰌋
ws-icon-9 = 9;

format = <label-state> <label-mode>

label-mode-foreground = ${colors.alert}
label-mode = %mode%
label-mode-padding = 1
label-mode-padding-right = 0
label-mode-alignment = center
; label-mode-background = #e60053

label-unfocused = %icon%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.foreground}
label-unfocused-alignment = center

label-visible = %icon%
label-visible-padding = 1
label-visible-foreground = ${colors.foreground}
label-visible-alignment = center

label-focused = %icon%
label-focused-padding = 1
label-focused-foreground = ${colors.primary}
label-focused-alignment = center

; urgent = Workspace with urgency hint set
label-urgent = %icon%
label-urgent-padding = 1
label-urgent-foreground = ${colors.alert}
label-urgent-alignment = center

; Separator in between workspaces
label-separator = "/"
label-separator-padding = 2
;label-separator-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
adapter = AC
full-at = 95
low-at = 20
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${xrdb:color6}
label-charging= %percentage:2%%

format-full = <ramp-capacity> <label-full>
format-full-foreground = ${xrdb:color6}
label-full= %percentage:2%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${xrdb:color4}
label-discharging= %percentage:2%%
;label-discharging-foreground = #FF9999

format-low = <ramp-capacity> <label-low>
format-low-foreground = ${colors.alert}
label-low = %percentage:2%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁽
ramp-capacity-3 = 󰁿
ramp-capacity-4 = 󰂁
ramp-capacity-5 = 󰁹

animation-charging-0 = 󰁺
animation-charging-1 = 󰁻
animation-charging-2 = 󰁽
animation-charging-3 = 󰁿
animation-charging-4 = 󰂁
animation-charging-5 = 󰁹

;animation-discharging-0 =
;animation-discharging-1 =
;animation-discharging-2 =
;animation-discharging-3 =
;animation-discharging-4 =
;animation-discharging-foreground = ${colors.foreground-alt}
;animation-discharging-framerate = 750

[module/battery0]
inherit = module/battery
battery = BAT0

[module/battery1]
inherit = module/battery
battery = BAT1


[module/date]
type = internal/date

; Seconds to sleep between updates
interval = 1.0

; See "http://en.cppreference.com/w/cpp/io/manip/put_time" for details on how to format the date string
; NOTE: if you want to use syntax tags here you need to use %%{...}
date = %Y-%m-%d

; Optional time format
time = %H:%M

; if `date-alt` or `time-alt` is defined, clicking
; the module will toggle between formats
date-alt = %a %d %b %Y
time-alt = %H:%M:%S %Z

label =   %date%  /  󰥔  %time%
;label-font = 0
label-foreground = ${colors.foreground}


[module/wireless-network]
type = internal/network
interface = wlp3s0

format-connected = <ramp-signal>
;label-connected = %essid%
;label-connected-foreground = #5ab414

format-disconnected = 󰤮
format-disconnected-foreground = ${colors.secondary}

format-packetloss = 󰤫
;label-packetloss = %essid%
format-packetloss-foreground = ${colors.alert}

;ramp-signal-foreground = #5ab414
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨


[module/mpd]
type = internal/mpd
;format-online =  <label-song> <icon-prev> <icon-stop> <toggle> <icon-next>
format-online = <icon-prev>  <toggle>  <icon-next>  <label-song>
;label-foreground = #5ab414
;format-prefix-foreground = #5ab414

icon-prev = 
icon-stop = 
icon-play = 
icon-pause = 
icon-next = 

label-song-maxlen = 25
label-song-ellipsis = true

[module/cpu]
type = internal/cpu

; Seconds to sleep between updates
; Default: 1
interval = 1

label =  %percentage:2%%
label-alignment = center

;label-foreground = #0066cc
label-foreground = ${xrdb:color6}
label-padding-right = 0

[module/memory]
type = internal/memory

; Seconds to sleep between updates
; Default: 1
interval = 3
format =  <label>
format-foreground = ${xrdb:color8}

; Available tokens:
;   %percentage_used% (default)
;   %percentage_free%
;   %gb_used%
;   %gb_free%
;   %gb_total%
;   %mb_used%
;   %mb_free%
;   %mb_total%
;   %percentage_swap_used%
;   %percentage_swap_free%
;   %mb_swap_total%
;   %mb_swap_free%
;   %mb_swap_used%
;   %gb_swap_total%
;   %gb_swap_free%
;   %gb_swap_used%

label = %percentage_used:3%%

[module/temperature]
type = internal/temperature


; Seconds to sleep between updates
; Default: 1
interval = 1

; Thermal zone to use
; To list all the zone types, run
; $ for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; done
; Default: 0
thermal-zone = 0

; Full path of temperature sysfs path
; Use `sensors` to find preferred temperature source, then run
; $ for i in /sys/class/hwmon/hwmon*/temp*_input; do echo "$(<$(dirname $i)/name): $(cat ${i%_*}_label 2>/dev/null || echo $(basename ${i%_*})) $(readlink -f $i)"; done
; to find path to desired file
; Default reverts to thermal zone setting
;hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon2/temp1_input

; Threshold temperature to display warning label (in degrees celsius)
; Default: 80
warn-temperature = 80

format = <ramp> <label>
format-foreground = ${xrdb:color6}

format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.alert}

label = %temperature-c%
label-warn = %temperature-c%

ramp-0 = 
ramp-1 = 
ramp-2 = 


[module/ext-ipv4]
type = custom/script
exec = $HOME/.config/polybar/pub-ipv4.sh
label = %output%
label-foreground = ${colors.foreground}
interval=5

[module/layout]
type = custom/script
exec = $HOME/.config/polybar/layout.sh
tail = true
label = %output%
format = <label>
label-foreground = ${colors.foreground}
;interval=1

[module/pulseaudio]
type = internal/pulseaudio

format-volume = 󰕾 <label-volume>
format-volume-foreground = ${xrdb:color8}

label-volume = %percentage:2%%
;label-volume-foreground = #388E8E

format-muted = 󰝟 <label-muted>
format-muted-foreground = ${colors.alert}
label-muted = %percentage:2%%
;label-muted-foreground = #388E8E

;bar-volume-width = 5
;;bar-volume-foreground-0 = #55aa55
;;bar-volume-foreground-1 = #55aa55
;;bar-volume-foreground-2 = #55aa55
;;bar-volume-foreground-3 = #55aa55
;;bar-volume-foreground-4 = #55aa55
;;bar-volume-foreground-5 = #f5a70a
;;bar-volume-foreground-6 = #ff5555
;bar-volume-gradient = false
;bar-volume-indicator = |
;bar-volume-indicator-font = 2
;bar-volume-indicator-foreground = ${colors.foreground}
;bar-volume-fill = ─
;bar-volume-fill-font = 2
;bar-volume-fill-foreground = #9f78e1
;bar-volume-empty = ─
;bar-volume-empty-font = 2
;bar-volume-empty-foreground = ${colors.foreground-alt}

[module/xbacklight]
type = internal/xbacklight

format = <ramp> <label>
format-foreground = ${xrdb:color5}
label = %percentage:3%%

ramp-0 = 󰃞
ramp-1 = 󰃝
ramp-2 = 󰃟
ramp-3 = 󰃠

;label-foreground = #cccc00

;bar-width = 5
;bar-indicator = |
;bar-indicator-foreground = #fff
;bar-indicator-font = 2
;bar-fill = ─
;bar-fill-font = 2
;bar-fill-foreground = #9f78e1
;bar-empty = ─
;bar-empty-font = 2
;bar-empty-foreground = ${colors.foreground-alt}

[module/backlight-acpi]
inherit = module/xbacklight
type = internal/backlight
card = intel_backlight

[module/tray]
type = internal/tray
#tray-padding = 4
tray-spacing = 12px
